# 로컬 Neo4j 실행 파일. 빈 DB로 시작하고 데이터는 직접 적재한다(합성 stub은 scripts/seed_fixture_graph.py).
#
# [개발용] 빈 DB에서 시작해 직접 적재한다
#   docker compose up -d          # 시작 (처음에는 이미지를 내려받는다)
#   docker compose ps             # healthy 가 되면 사용 가능
#   docker compose down           # 중지 (데이터는 볼륨에 남는다)
#   docker compose down -v        # 중지 + 그래프 데이터 삭제
#   필요: 레포 루트 `.env`의 NEO4J_PASSWORD (사용자는 항상 `neo4j`). 비어 있으면 컨테이너가 종료와 재시작을 반복한다 (`docker compose ps`에서 Restarting, `docker logs trend-agent-neo4j`)
#   필요: Docker Desktop 메모리 4GB 이상 (Neo4j가 약 2GB). 부족하면 OOM으로 재시작을 반복하고 healthy가 되지 않는다
#         확인: docker inspect -f '{{.State.OOMKilled}}' trend-agent-neo4j  /  docker stats --no-stream
#   선택: NEO4J_BOLT_PORT / NEO4J_HTTP_PORT — 이미 쓰는 Neo4j와 포트가 겹칠 때 (바꾸면 `.env`의 NEO4J_URI 포트도 같이)
#
# 브라우저: http://localhost:<HTTP 포트> (기본 포트는 아래 `:-` 뒤의 값)
name: trend-agent

services:
  neo4j:
    image: neo4j:5.26-community        # 5.x LTS. 버전을 바꾸면 spec §7.3과 같이 갱신한다
    container_name: trend-agent-neo4j
    restart: unless-stopped
    ports:                              # 이 PC에서만 접속된다 (127.0.0.1)
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-}"   # 비어 있으면 컨테이너가 시작 직후 종료된다 (README "자주 막히는 곳")
      # Neo4j 기본은 8자 이상이다. 로컬 개발 편의로 최소 길이를 낮출 수 있게 열어 둔다. 공유 서버에서는 8자 이상을 쓴다.
      NEO4J_dbms_security_auth__minimum__password__length: "${NEO4J_MIN_PASSWORD_LENGTH:-5}"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
      NEO4J_server_memory_pagecache_size: "512m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s


volumes:
  neo4j_data:
  neo4j_logs:
