# 쓸 수 있는 LLM 모델 등록표 (docs/pipeline.md D-30, §6.4, §14.2)
# - 여기 없는 모델은 호출할 수 없다(LLMBackendError). 캐시 재생도 같다. 모델 이름으로 계열을 추정하지 않는다.
# - profile: standard(일반 모델, temperature 0) | reasoning(추론 모델, temperature 없음, reasoning_effort)
#   계열별 요청 규칙은 src/fashion_planner_trend/llm/models/<profile>.py 에 있다.
# - efforts: reasoning 모델이 허용하는 추론 강도 목록 (standard에는 쓰지 않는다)
# - checked_at: 이 모델이 이 코드로 동작하는 것을 확인한 날짜. 새 모델은 합성 문장 1건으로 확인한 뒤 적는다:
#     python scripts/check_llm_model.py --model <모델> --profile <계열> [--reasoning-effort <강도>]
models:
  gpt-4o-mini:
    profile: standard
    checked_at: "2026-11-09"
    note: 기준선. 실제 기사 실험 호출로 확인 (v3·v4, 라벨 5건)
  gpt-4.1:
    profile: standard
    checked_at: "2026-11-09"
    note: 실제 기사 실험 호출로 확인 (v4, 라벨 5건)
  gpt-5-mini:
    profile: reasoning
    efforts: [minimal, low, medium, high]
    checked_at: "2026-11-10"
    note: 합성 확인 통과 (scripts/check_llm_model.py, medium — temperature 없이 strict JSON 응답, 출력 233 중 추론 192 토큰)
  gpt-6-sol:
    profile: reasoning
    efforts: [none, low, medium, high, xhigh, max]
    checked_at: "2026-11-11"
    note: 합성 확인 통과 (none 출력 32 토큰 · medium 출력 74 토큰). 현행 모델, 지식 기준 2026-04 (OpenAI 모델 문서)
  gpt-5:
    profile: reasoning
    efforts: [minimal, low, medium, high]
    checked_at: "2026-11-11"
    note: 합성 확인 통과 (minimal, 출력 41 토큰 — 첫 시도는 120s 시간 초과, 재시도 1.8s). OpenAI 문서상 Deprecated
  o3:
    profile: reasoning
    efforts: [low, medium, high]
    checked_at: "2026-11-11"
    note: 합성 확인 통과 (low, 출력 195 토큰). OpenAI 문서상 Deprecated(후속 gpt-5). efforts는 문서에 없어 low·medium·high로 둠
