# 유사도 가중치 기본값 (문서: docs/spec.md Step 9, §7.3). 모두 임의 시작값이고 평가 후 조정한다.
#
# 점수 = base_score + alpha × [category_minor 일치]
#   base_score = Σ(일치한 속성의 적용 가중치 × 일치 비율) ÷ Σ(비교 가능한 속성의 적용 가중치)
#   적용 가중치 = base_weights[속성] × 트렌드 배수(핵심 / 보조 / 해당 없음)
#
# 카테고리 (사용자 결정, default):
#   - 상분류(category_major)는 점수가 아니라 후보 조건이다 (같은 상분류의 Product만 후보). 가중치를 두지 않는다.
#   - 하분류(category_minor)는 가중치 합에 넣지 않고, 일치할 때만 alpha를 더한다. 불일치·미확인은 0 (감점 없음).
#   - 순위가 어색하면 먼저 alpha를 올린다. 대안(하분류를 가중치 속성으로)은 평가 후 검토한다.
#   - 트렌드가 카테고리 자체인 경우(스커트가 주인공인 트렌드 등)에는 Style의 focus에 `category`가 오고,
#     그때 보너스는 alpha × focus_multipliers 배수(core 2.0 → 0.2)가 된다. `category`가 없으면 alpha 그대로.
base_weights:
  color: 3
  detail: 3
  pattern: 2
  material: 2
  fit: 2

category:
  major: gate            # gate = 후보 조건 (점수에 쓰지 않음)
  minor_bonus_alpha: 0.1 # 하분류 일치 보너스

# 트렌드(Style)의 핵심·보조 속성 배수. 모두 1.0으로 두면 기본 가중치만 쓴다.
focus_multipliers:
  core: 2.0
  supporting: 1.5
  default: 1.0

# ---------------------------------------------------------------------------------------------------------
# v1.1 구조 (계약 G1, 2026-11-08). 구조는 L0, 값은 T4 평가 근거로만 바꾼다(contract_change).
# 키가 없으면 코드 기본값 = v1.0 동작이다. 로더(retrieval/weights.py, T3)는 아래 키를 Optional + 기본값으로 읽는다.
# ---------------------------------------------------------------------------------------------------------
flags:
  # strict | report — 용어 해석(Tier1 이름 일치·Tier3 의미 일치) 경로에만 적용한다.
  #   report: 시즌 미확인·불일치 Style도 내보내고 season_status와 한계(limitations)로 알린다 (PLAN §5 Tier1).
  #   시즌만 주는 기존 검색(search())은 이 값과 상관없이 strict(v1.0 동작: 시즌 미확인 Style 보류)다.
  season_policy: report
  image_first_tiebreak: false  # 동점이면 has_image 우선 — fast path·sort_key·verify_graph_search에 함께 적용
  core_unknown_decay: 0.0      # γ: 미확인 core 속성 가중치를 분모에 더하는 비율 (0 = 끔 = v1.0 식)
  snap_id_limit: 0             # Item별 상품 목록에서 같은 snap_id 최대 개수 (0 = 제한 없음)
  item_gender_filter: false    # 결정 G0-③: Item 성별(남/여)과 반대 성별 상품 제외. 공용·미상은 통과. 기본 꺼짐

tier4:                         # LLM 등급 → 코드 수치화 (LLM은 숫자를 내지 않는다)
  value_weights: {primary: 1.0, secondary: 0.5}
  core_unknown_decay: 0.5      # Tier4 모드에서 쓰는 γ (임시)
  item_focus: {core: 1.0, supporting: 0.75}

resolver:
  tier3: {tau: null, delta: null}  # 코사인 ≥ τ 이고 1·2위 차이 ≥ δ. T4 보정 전에는 null → Tier3 건너뜀(steps: tier3_disabled)

trend_topk:
  pool_per_item: 20            # Item마다 모으는 후보 수 (트렌드 단위 Top-K 계산용)
