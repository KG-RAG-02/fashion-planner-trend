# 02 상품명·feature 텍스트 키워드 오탐 가드 (alias_map.md §10, 버그 (f)).
# 형식: guards = 키(표준 값·별칭 원문): [이 단어가 토큰에 있으면 그 키를 버린다]. 한국어 키(토큰 안 부분 일치)에만 쓴다.
# 근거: 02 원천 상품명 집계(T2 설계 메모 §2.2) — 지브라는 `빈티지브라운` 등 5/5 오탐, 비즈니스·내셔널지오그래픽 등.
attribute: text_guard
guards:
  비즈: [비즈니스]
  무지: [무지개]
  스터드: [커스터드]
  슬릿: [애슬릿]
  그래픽: [지오그래픽]
  믹스: [믹스드, 코믹스, 쿨믹스, 트랙믹스]
  지브라: [지브라운]
