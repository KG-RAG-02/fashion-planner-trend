# 02 다중 의류 분해(세트·셋업) 사전 — set_split.py. 근거: 02 원천 상품명 198행 검토(2026-11-08).
# 키 비교: 소문자·공백/-/_ 제거(norm_key). 한글 키는 토큰 안 부분 일치(긴 키 우선), 영문 키는 토큰 = 키 또는 키+s/es.
# 이 파일은 표준 어휘가 아니라 분해 규칙용이다(AliasMap 인터페이스는 바꾸지 않는다).
attribute: set_components
garments:            # 표준 하분류: [키]
