  스커트: [스커트, 치마, skirt]
  레깅스: [레깅스, 타이즈, leggings]
  코트: [코트, coat]
  재킷: [자켓, 재킷, 블레이저, 블루종, 아노락, 바람막이, 윈드브레이커, 초어자켓, 트러커, 트랙탑, 수트, 슈트, 정장, 브레이커,
