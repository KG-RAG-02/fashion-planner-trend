# 별칭 사전 (category). 문서: docs/schemas/sources/alias_map.md
# 형식: aliases = 표준 값: [같은 뜻의 원문], approx = 근사 매핑(1차 검색에서는 쓰지 않음),
#       null_values = 값 없음, route = 다른 속성으로 이동, hint = 같은 행의 다른 필드에 주는 힌트.
# 원문은 코드가 소문자·공백·-·_ 제거로 정규화해서 비교한다.
attribute: category
aliases:
  재킷: [자켓, 청자켓]
  팬츠: [반바지, 쇼츠, 쇼트팬츠, 슬랙스, pants]
  스커트: [치마, 주름치마]
  니트웨어: [스웨터, knitwear]
  베스트: [조끼]
  티셔츠: [t셔츠, t-shirt, tshirt, 맨투맨]
  짚업: [집업]
  점프수트: [오버올]
  드레스: [원피스]
  점퍼: [야상]
  코트: [coats]
approx: {}
null_values: [UNKNOWN, 알수없음, 미지정, 미확인, 확인불가, 알려지지않음, 모르겠음, 불명, notapplicable, none, 'null', 없음, 없는, 타이트, 상, 타입, 끝창, 층, 모자,
  스카프, 가방, 부츠, 백팩, 헤드웨어, 야구모자, 햇모자]
