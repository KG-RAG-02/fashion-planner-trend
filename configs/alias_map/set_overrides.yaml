# 02 세트 분해 검수 덮어쓰기 — 규칙(set_split.py) 판정 뒤에 적용한다. 사람이 채택한 것만 적는다.
# 근거: 원본 사진을 보고 낸 1차 검토 의견(sha256 161453d6…)을 사람이 검토해 채택한 결과(2026-11-08, 14행 분해 · 13행 split_candidate 해제).
# split: product_id → 구성품(표준 하분류·상분류). 구성품 Product는 split_from="review", 이미지는 부모 공유(full_set),
#        색·소재는 부모 공유, 패턴은 부모 상품명 전체에서(셋업은 같은 원단), 디테일·세이프는 붙이지 않는다.
#        raw = 검토 의견에 적힌 상품명 근거 토큰(이름에 없는 구성품은 사진 근거라 토큰이 표지뿐일 수 있다).
# clear_candidate: product_id → null. split_candidate 표시를 지운다(분해하지 않음).
# 상품명은 적지 않는다. 확인할 때는 원 데이터셋에서 product_id(파일·행 번호)로 찾는다. 코드는 키만 읽는다.
